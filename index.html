<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="這是我的 GitHub Pages 個人網站，展示我的作品與基本資訊。">
    <meta name="theme-color" content="#2563eb">
    <title>我的網站</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --primary: #2563eb;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
        background: linear-gradient(180deg, #eff6ff 0%, var(--bg) 100%);
        color: var(--text);
        line-height: 1.7;
      }

      .container {
        width: min(960px, calc(100% - 2rem));
        margin: 0 auto;
      }

      header {
        background: rgba(255, 255, 255, 0.9);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        backdrop-filter: blur(8px);
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 0;
      }

      .brand {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--primary);
      }

      .nav-links {
        display: flex;
        gap: 1rem;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .nav-links a {
        text-decoration: none;
        color: var(--text);
        font-weight: 500;
      }

      main {
        padding: 4rem 0 3rem;
      }

      .hero {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.08);
        padding: 3rem 2rem;
        text-align: center;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3.5rem);
        margin: 0 0 1rem;
      }

      .subtitle {
        font-size: 1.1rem;
        color: var(--muted);
        margin: 0 auto 1.5rem;
        max-width: 600px;
      }

      .cta {
        display: inline-block;
        background: var(--primary);
        color: white;
        text-decoration: none;
        padding: 0.8rem 1.5rem;
        border-radius: 999px;
        font-weight: 600;
      }

      section {
        margin-top: 2rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2rem;
      }

      h2 {
        margin-top: 0;
        font-size: 1.8rem;
      }

      ul {
        padding-left: 1.25rem;
      }

      footer {
        padding: 2rem 0 3rem;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        nav {
          flex-direction: column;
          gap: 0.75rem;
        }

        .nav-links {
          gap: 0.75rem;
          flex-wrap: wrap;
          justify-content: center;
        }

        .hero {
          padding: 2rem 1rem;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="container">
        <nav aria-label="主選單">
          <div class="brand">我的網站</div>
          <ul class="nav-links">
            <li><a href="#about">關於我</a></li>
            <li><a href="#projects">作品</a></li>
            <li><a href="#contact">聯絡我</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h1>你好，世界！</h1>
        <p class="subtitle">這是我的第一個 GitHub Pages 網站，現在已經有更好的結構與風格了。</p>
        <a class="cta" href="#about">了解更多</a>
      </section>

      <section id="about">
        <h2>關於我</h2>
        <p>
          我正在學習前端開發，使用 HTML、CSS 和 JavaScript 建立自己的個人網站。
          這個網站會慢慢更新，並用來展示我的作品與學習成果。
        </p>
      </section>

      <section id="projects">
        <h2>作品</h2>
        <ul>
          <li>個人網站首頁</li>
          <li>簡單的作品展示頁</li>
          <li>GitHub Pages 靜態網站</li>
        </ul>
      </section>

      <section id="contact">
        <h2>聯絡我</h2>
        <p>Email:hiyohibaluobuo@gmail.com</p>
      </section>
    </main>

    <footer>
      © 2026 我的網站
    </footer>
  </body>
</html>
